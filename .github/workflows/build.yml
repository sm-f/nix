name: Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: scottmckendry
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        run: nix flake update --print-build-logs

      - name: Check what needs warming
        id: plan
        run: |
          top=$(nix eval --raw \
            .#nixosConfigurations.eris.config.system.build.toplevel.outPath)
          echo "toplevel: $top"
          if nix path-info --store https://scottmckendry.cachix.org "$top" >/dev/null 2>&1; then
            echo 'Already in Cachix; nothing to push.'
          else
            echo 'warm=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-fetch DisplayLink zip
        if: steps.plan.outputs.warm == 'true'
        run: |
          eval "$(nix eval --impure --raw --file utils/displaylink-info.nix)"
          nix-prefetch-url --name "$name" "$url"

      - name: Build eris
        if: steps.plan.outputs.warm == 'true'
        run: |
          nix build .#nixosConfigurations.eris.config.system.build.toplevel \
            --no-link \
            --print-build-logs
