# config for haunt
# https://github.com/scottmckendry/haunt
shell = ["nu"]

[apps."scratch terminal"]
bind = "ctrl+\\"
cmd = ["nu"]
size = "half"

[apps."secondary terminal"]
bind = "ctrl+~"
cmd = ["nu"]
size = "half"

[apps.pi]
bind = "ctrl+space"
cmd = ["pi"]
size = "half"

[apps.lazygit]
bind = "ctrl+g"
cmd = ["lazygit"]
size = "full"

[apps.k9s]
bind = "ctrl+k"
cmd = ["k9s"]
size = "full"
